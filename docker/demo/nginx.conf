# Web demo: phục vụ bản build của Vite và chuyển /api/ sang API trong cùng mạng Docker.
# API đặt tiền tố /api/v1 (API_PREFIX) nên giữ nguyên đường dẫn khi chuyển tiếp.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Ảnh/tệp tải lên có thể lớn hơn mặc định 1 MB của nginx.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tệp băm tên của Vite: cache lâu.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: mọi đường dẫn khác trả index.html để react-router xử lý.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
