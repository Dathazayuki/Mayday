# Cổng chỉ mở trên 127.0.0.1: máy khác trong mạng LAN không truy cập được CSDL/MinIO dev.
services:
  minio:
    # Image MinIO chính thức trên quay.io/Docker Hub không còn tải công khai; dùng bản Chainguard (vẫn được vá bảo mật).
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:${MINIO_PORT:-9100}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-drmayday}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-drmayday-dev-secret}
    volumes:
      - minio-data:/data

  # CSDL dev tạm thời (MT-19, MT-57). Cổng host 3307 vì 3306 đã có MySQL khác trên máy.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-drmayday-root-dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drmayday}
      MYSQL_USER: ${MYSQL_USER:-drmayday}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drmayday-dev-secret}
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-drmayday-root-dev}',
        ]
      interval: 5s
      retries: 20

volumes:
  minio-data:
  mysql-data:
