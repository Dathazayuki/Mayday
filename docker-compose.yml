services:
  minio:
    # Image MinIO chính thức trên quay.io/Docker Hub không còn tải công khai; dùng bản Chainguard (vẫn được vá bảo mật).
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-drmayday}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-drmayday-dev-secret}
    volumes:
      - minio-data:/data

volumes:
  minio-data:
