services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-drmayday}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-drmayday-dev-secret}
    volumes:
      - minio-data:/data

volumes:
  minio-data:
