# Cổng chỉ mở trên 127.0.0.1: máy khác trong mạng LAN không truy cập được CSDL/MinIO dev.
services:
  minio:
    # Image MinIO chính thức trên quay.io/Docker Hub không còn tải công khai; dùng bản Chainguard (vẫn được vá bảo mật).
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:${MINIO_PORT:-9100}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-drmayday}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-drmayday-dev-secret}
    volumes:
      - minio-data:/data

  # CSDL dev/test: PostgreSQL 17. Schema nạp từ bản sao file SQL của nhóm DB bằng
  # `pnpm --filter @drmayday/api db:reset`. Cổng host 5434 vì 5433 đã có PostgreSQL của dự án khác.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drmayday}
      POSTGRES_USER: ${POSTGRES_USER:-drmayday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drmayday-dev-secret}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 20

volumes:
  minio-data:
  postgres-data:
