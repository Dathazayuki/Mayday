databases:
  - name: drmayday-db
    databaseName: drmayday
    user: drmayday
    region: singapore
    plan: free

services:
  # Backend API (NestJS)
  - type: web
    name: drmayday-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm@11.5.3 && pnpm install --frozen-lockfile && pnpm --filter @drmayday/shared build && pnpm --filter @drmayday/api prisma:generate && pnpm --filter @drmayday/api build
    startCommand: pnpm --filter @drmayday/api start:prod
    envVars:
      - key: APP_ENV
        value: development
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: drmayday-db
          property: connectionString
      - key: JWT_SECRET
        value: 6846d3424c02aa007650463407aad828d4659822dc8f697cba42acd9af2ec44b
      - key: JWT_EXPIRES_IN
        value: 86400
      - key: CORS_ORIGINS
        value: https://drmayday-web.onrender.com

  # Frontend Web (React + Vite)
  - type: web
    name: drmayday-web
    runtime: static
    buildCommand: npm install -g pnpm@11.5.3 && pnpm install --frozen-lockfile && pnpm --filter @drmayday/shared build && pnpm --filter @drmayday/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://drmayday-api.onrender.com
