databases:
  - name: drmayday-db
    databaseName: drmayday
    user: drmayday
    region: singapore
    plan: free

services:
  # Backend API (NestJS)
  - type: web
    name: drmayday-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm@11.5.3 && pnpm install --frozen-lockfile && pnpm --filter @drmayday/shared build && pnpm --filter @drmayday/api build
    startCommand: pnpm --filter @drmayday/api start:prod
    envVars:
      - key: APP_ENV
        value: development
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: drmayday-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 86400
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: drmayday-web
          property: url

  # Frontend Web (React + Vite)
  - type: web
    name: drmayday-web
    runtime: static
    buildCommand: npm install -g pnpm@11.5.3 && pnpm install --frozen-lockfile && pnpm --filter @drmayday/shared build && pnpm --filter @drmayday/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      # Hoặc người dùng có thể cấu hình VITE_API_BASE_URL trỏ về URL của drmayday-api
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: drmayday-api
          property: url
